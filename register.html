<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><a class="brand" href="homepage.html">📚 Engineering Book Store</a><nav><a href="homepage.html">Home</a><a href="catalogue.html">Catalogue</a><a href="login.html">Login</a></nav></header>
<main class="form-wrap"><form id="register-form" class="panel"><p class="eyebrow">JOIN OUR LIBRARY</p><h1>Create your account</h1>
<label for="fname">First name</label><input id="fname" name="fname" minlength="2" required>
<label for="lname">Last name</label><input id="lname" name="lname" required>
<label for="email">Email address</label><input id="email" name="email" type="email" required>
<label for="password">Password (minimum 6 characters)</label><input id="password" name="password" type="password" minlength="6" required>
<label for="address">Address</label><textarea id="address" name="address" rows="3" required></textarea>
<label for="mobile">Mobile number</label><input id="mobile" name="mobile" type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required>
<fieldset><legend>Gender (optional)</legend><label class="inline"><input type="radio" name="gender" value="Male"> Male</label><label class="inline"><input type="radio" name="gender" value="Female"> Female</label><label class="inline"><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label></fieldset>
<button class="btn" type="submit">Create account</button><p id="register-message" class="message" role="status"></p><p>Already registered? <a href="login.html">Login</a></p></form></main><script src="app.js"></script></body></html>
